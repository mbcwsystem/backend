<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 / 회원가입</title>

    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" href="/static/css/login.css">
</head>

<body>
<div class="container">

    <div class="tabs">
        <button id="login-tab" class="active" onclick="showLogin()">로그인</button>
        <button id="signup-tab" onclick="showSignup()">회원가입</button>
    </div>

    <!-- 로그인 -->
    <div id="login-box" class="form-box">
        <input id="login-username" type="text" placeholder="아이디">
        <input id="login-password" type="password" placeholder="비밀번호">
        <button class="submit-btn" onclick="login()">로그인</button>
        <button class="go-main-btn" onclick="goMainPage()">메인페이지로 이동</button>
        <button class="go-community-btn" onclick="goCommunityPage()">커뮤니티로 이동</button>
        <button class="go-schedule-btn" onclick="goSchedulePage()">스케줄페이지로 이동</button>
        <div id="login-msg" class="msg"></div>
    </div>

    <!-- 회원가입 -->
    <div id="signup-box" class="form-box" style="display:none;">
        <input id="signup-name" type="text" placeholder="이름">
        <input id="signup-username" type="text" placeholder="아이디">
        <input id="signup-password" type="password" placeholder="비밀번호">

        <select id="signup-position">
            <option value="점장">점장</option>
            <option value="매니저">매니저</option>
            <option value="바이저">바이저</option>
            <option value="리더">리더</option>
            <option value="크루">크루</option>
            <option value="미화">미화</option>
            <option value="시스템">시스템</option>
        </select>

        <select id="signup-gender">
            <option value="남">남</option>
            <option value="여">여</option>
        </select>

        <input id="signup-phone" type="text" placeholder="휴대폰번호">
        <input id="signup-email" type="text" placeholder="이메일">

        <button class="submit-btn" onclick="signup()">회원가입</button>
        <div id="signup-msg" class="msg"></div>
    </div>

</div>

<!-- JS 파일 연결 -->
<script src="/static/js/login.js"></script>

</body>
</html>
