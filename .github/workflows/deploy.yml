name: Deploy Dev (FastAPI Docker / Windows)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ SSH Agent 설정 (최신 버전)
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 3️⃣ 서버에 배포 명령
      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no -p 22 ${{ secrets.DEV_SERVER_USER }}@${{ secrets.DEV_SERVER_HOST }} << 'EOF'
            cd "C:/Users/megab/Desktop/server/backend"
            git pull origin dev
            docker compose down
            docker compose build
            docker compose up -d
          EOF
