services:
  api:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.dev
    container_name: megabox-api-dev
    ports:
      - "8000:8000"
    env_file:
      - ../envs/.env.dev
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ../app:/app/app
    networks:
      - megabox-net
    command: >
      bash -c "sleep 5 && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

networks:
  megabox-net:
    driver: bridge
