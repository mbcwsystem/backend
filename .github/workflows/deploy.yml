name: Deploy Dev Server

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Windows Server (DEBUG MODE)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            powershell -Command "
              Write-Host '==============================';
              Write-Host '🔍 POWERSHELL CONTEXT';
              Write-Host '==============================';
              whoami;
              Get-Location;
              pwd;
              echo '--- docker command (windows) ---';
              Get-Command docker -ErrorAction SilentlyContinue;
              docker --version;
              docker ps;
            
              Write-Host '==============================';
              Write-Host '🔍 FILE SYSTEM CHECK';
              Write-Host '==============================';
              dir C:\Users\megaa\Desktop\server;
            
              Write-Host '==============================';
              Write-Host '🔍 GIT STATUS (Windows)';
              Write-Host '==============================';
              cd C:\Users\megaa\Desktop\server;
              git status;
              git branch;
              git log -1 --oneline;
            
              Write-Host '==============================';
              Write-Host '🔍 WSL CONTEXT';
              Write-Host '==============================';
              wsl bash -lc '
                whoami
                pwd
                echo --- docker command (wsl) ---
                docker --version
                docker ps
            
                echo ==============================
                echo 🔍 FILE SYSTEM CHECK (WSL)
                echo ==============================
                ls -al /mnt/c/Users/megaa/Desktop/server
            
                echo ==============================
                echo 🔍 GIT STATUS (WSL)
                echo ==============================
                cd /mnt/c/Users/megaa/Desktop/server
                git status
                git branch
                git log -1 --oneline
              '
            
              Write-Host '==============================';
              Write-Host '🚀 DEPLOY START (WSL)';
              Write-Host '==============================';
              wsl bash -lc '
                cd /mnt/c/Users/megaa/Desktop/server || exit 1
                docker compose -f ./docker/docker-compose.dev.yml down --volumes --remove-orphans
                docker compose -f ./docker/docker-compose.dev.yml build --no-cache
                docker compose -f ./docker/docker-compose.dev.yml up -d
                echo ==============================
                echo 🔍 CONTAINER STATUS AFTER DEPLOY
                echo ==============================
                docker ps
                docker compose -f ./docker/docker-compose.dev.yml ps
              '
            
              Write-Host '==============================';
              Write-Host '✅ DEPLOY SCRIPT END';
              Write-Host '==============================';
            "