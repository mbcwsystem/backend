name: Deploy Dev (FastAPI Docker / Windows)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -p 22 ${{ secrets.DEV_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no -p 22 megabox@${{ secrets.DEV_SERVER_HOST }} << 'EOF'
            cd /c/Users/megab/Desktop/server/backend
            git pull origin dev
            docker compose down
            docker compose build
            docker compose up -d
          EOF
