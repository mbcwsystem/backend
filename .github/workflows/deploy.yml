- name: Deploy to Windows Server
  uses: appleboy/ssh-action@v1.0.3
  with:
    host: ${{ secrets.SERVER_HOST }}
    username: ${{ secrets.SERVER_USER }}
    key: ${{ secrets.SERVER_SSH_KEY }}
    script: |
      cd C:/path/to/project
      git pull origin dev
      docker compose down
      docker compose up -d --build
