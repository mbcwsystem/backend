name: Deploy Dev (FastAPI Docker / Windows)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 ${{ secrets.DEV_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/id_ed25519 -p 22 megabox@${{ secrets.DEV_SERVER_HOST }} << 'EOF'
            cd /c/Users/megab/Desktop/server/backend
            git pull origin dev
            docker compose down
            docker compose build
            docker compose up -d
          EOF
