<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메인 페이지</title>

    <link rel="stylesheet" href="/static/css/main.css">
</head>

<body>
<div class="main-container">

    <h2 id="welcome-text">안녕하세요!</h2>

    <!-- 아이디 비번 입력칸 -->
    <div class="login-form">
        <input id="main-username" type="text" placeholder="아이디">
        <input id="main-password" type="password" placeholder="비밀번호">
    </div>

    <!-- 버튼 4종 -->
    <div class="btn-group">
        <button onclick="checkIn()">출근</button>
        <button onclick="startBreak()">휴식</button>
        <button onclick="endBreak()">복귀</button>
        <button onclick="checkOut()">퇴근</button>
    </div>

    <div id="action-message" class="action-message"></div>

</div>

<script src="/static/js/main.js"></script>
</body>
</html>
